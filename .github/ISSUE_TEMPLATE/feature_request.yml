name: 功能建议
description: 希望增加或改进某个功能
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景，而不是直接描述方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
