name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --publish never: electron-builder auto-publishes when a tag is present,
      # but uploading is the release step's job below.
      - name: Build installer
        run: |
          npm run build
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LanComm-Setup-*.exe
            release/LanComm-Portable-*.exe
          generate_release_notes: true
